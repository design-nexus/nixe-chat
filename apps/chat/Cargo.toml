[package]
name = "nixe-chat"
version = "0.1.0"
description = "A desktop chat client for Ollama with tools, web search, and a Hugging Face model marketplace"
license = "MIT"
repository = "https://github.com/design-nexus/nixe-chat"
authors = ["Ken Smith"]
edition = "2024"

[[bin]]
name = "nixe-chat"
path = "src/main.rs"

[dependencies]
nixe-core = { git = "https://github.com/design-nexus/nixe-core.git", rev = "87682e6c936b6a4f006639b1a1c099e96346c07c" }
nixe-ui = { git = "https://github.com/design-nexus/nixe-design.git", rev = "b8204de80644e263e32783602f2e0ae393578c9e" }
nixe-theme = { git = "https://github.com/design-nexus/nixe-design.git", rev = "b8204de80644e263e32783602f2e0ae393578c9e" }
anyhow = "1"
async-channel = "2"
base64 = "0.22"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
futures-util = "0.3"
gtk = { version = "0.11", package = "gtk4", features = ["v4_18"] }
libc = "0.2"
pulldown-cmark = { version = "0.13", default-features = false }
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls"] }
rusqlite = { version = "0.40", features = ["bundled"] }
scraper = "0.24"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
syntect = { version = "5", default-features = false, features = ["default-syntaxes", "parsing", "regex-fancy"] }
tokio = { version = "1", features = ["rt-multi-thread", "sync", "time", "process", "io-util", "macros"] }
toml = "1"
zbus = { version = "5", default-features = false, features = ["tokio"] }

[dev-dependencies]
tokio = { version = "1", features = ["net"] }
